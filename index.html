<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#050508" />
    <link rel="icon" type="image/png" href="/brand/logo-mark-256.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <title>Anant Sutra Labs — AI Ads &amp; Cinematic Films</title>
    <meta name="description" content="AI-powered content production studio. Cinematic ads, UGC videos, brand films and AI filmmaking — studio-level judgment at AI-level speed." />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Anant Sutra Labs — AI Ads &amp; Cinematic Films" />
    <meta property="og:description" content="Studio-level judgment at AI-level speed." />
    <meta property="og:image" content="/brand/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "ProfessionalService",
      "name": "Anant Sutra Labs",
      "description": "AI-powered content production studio. Cinematic ads, UGC videos, brand films and AI filmmaking — studio-level judgment at AI-level speed.",
      "url": "https://www.anantsutralabs.com",
      "logo": "https://www.anantsutralabs.com/brand/logo-mark.png",
      "image": "https://www.anantsutralabs.com/brand/og-image.png",
      "email": "anantsutralabs@gmail.com",
      "telephone": "+91 99907 61899",
      "contactPoint": { "@type": "ContactPoint", "contactType": "WhatsApp", "telephone": "+91 75035 91899" },
      "sameAs": ["https://instagram.com/anantsutralabs", "https://www.linkedin.com/in/naveensharma03/"],
      "founder": {
        "@type": "Person",
        "name": "Naveen Sharma",
        "jobTitle": "Founder & AI Filmmaker",
        "description": "13+ year veteran of the animation and VFX industry, now directing AI-generated film and advertising production."
      },
      "makesOffer": [
        { "@type": "Offer", "name": "AI Image Generation", "description": "Product, fashion, portrait, food and branded visuals" },
        { "@type": "Offer", "name": "AI Video Generation", "description": "Reels, demos, commercials and cinematic films" },
        { "@type": "Offer", "name": "AI Voice & Audio", "description": "Voiceovers, dubbing, jingles and scores" },
        { "@type": "Offer", "name": "AI Avatars & Characters", "description": "Virtual influencers and brand spokespeople" },
        { "@type": "Offer", "name": "Motion & Post-Production", "description": "Graphics, editing, grading and upscaling" },
        { "@type": "Offer", "name": "3D & Product Visualization", "description": "360° spins and multi-angle renders" }
      ]
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!--
      Real, invisible HTML form — not rendered by React. Netlify's build bot
      scans the built static HTML for forms to register the schema; a form
      that only ever exists inside React's runtime output is invisible to
      that scan. This one is never shown or submitted itself — the actual
      form in Contact.tsx posts to Netlify under the same name and field set.
    -->
    <form name="contact" data-netlify="true" data-netlify-honeypot="bot-field" enctype="multipart/form-data" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="text" name="project" />
      <input type="file" name="referenceImage" />
      <input type="file" name="referenceVideo" />
      <textarea name="message"></textarea>
      <input type="text" name="bot-field" />
    </form>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
