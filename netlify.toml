[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# SPA fallback: React Router owns client-side routing, so every path must
# resolve to index.html or a direct visit to e.g. /portfolio 404s.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/work/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
